<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Se reemplaza con --base-href al compilar (el backend la sirve en /app/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tu plan, horarios y progreso en Yara Jump.">
  <meta name="theme-color" content="#D6247A">

  <!-- iPhone: al usar "Agregar a pantalla de inicio" abre a pantalla completa, sin barra del navegador -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yara Jump">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Yara Jump</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F7F4FA; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      font-family: -apple-system, system-ui, sans-serif; color: #6E6880;
      transition: opacity .3s;
    }
    #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 8px 24px rgba(106,27,154,.15); }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #E8E2F0; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #D6247A; border-radius: 2px;
      animation: carga 1s ease-in-out infinite;
    }
    @keyframes carga { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Yara Jump">
    <div class="bar"></div>
  </div>
  <script>
    // Quita el splash cuando Flutter pinta su primer frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script>
    // Notificaciones push (Firebase Cloud Messaging). Lo usa lib/services/push_web.
    // El service worker vive en /app/push/ (dentro de la PWA) para que iPhone lo acepte.
    window.yaraPush = {
      estado: function () {
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var instalada = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
          return ios && !instalada ? 'instalar' : 'no';
        }
        return Notification.permission; // default | granted | denied
      },
      token: async function (vapidKey, pedir) {
        var permiso = Notification.permission;
        // Sin await antes: Safari solo pide permiso si la llamada viene directo del toque.
        if (pedir && permiso === 'default') permiso = await Notification.requestPermission();
        if (permiso !== 'granted') return null;
        var base = document.baseURI;
        var reg = await navigator.serviceWorker.register(new URL('firebase-messaging-sw.js', base).href,
          { scope: new URL('push/', base).href });
        var m = window.firebase_messaging;
        if (!m) return null;
        var messaging = m.getMessaging();
        if (!window.yaraPushEscuchando) {
          window.yaraPushEscuchando = true;
          // Con la app abierta FCM no muestra nada por sí solo.
          m.onMessage(messaging, function (p) {
            var n = p.notification || {};
            reg.showNotification(n.title || 'Yara Jump', {
              body: n.body || '', icon: new URL('icons/Icon-192.png', base).href,
            });
          });
        }
        return await m.getToken(messaging, { vapidKey: vapidKey, serviceWorkerRegistration: reg });
      },
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
