name: yara_jumping
description: App de Yara Jump.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # API propia (Go)
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Login con Google (solo para obtener el ID token)
  google_sign_in: ^7.1.0

  # Push: Firebase solo se usa para recibir notificaciones (FCM)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Dispositivo
  local_auth: ^2.3.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Utilidades
  intl: ^0.20.3
  fl_chart: ^1.3.1
  google_fonts: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Ícono de la app: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/images/logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.png
  adaptive_icon_foreground_inset: 16
